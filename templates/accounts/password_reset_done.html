{% extends "accounts/base_auth.html" %}
{% block title %}Check your email — {{ BRAND.name }}{% endblock %}
{% block auth %}
<span class="icon-tile" style="width:60px;height:60px"><svg class="i i-lg"><use href="#i-mail"/></svg></span>
<h1>Check your email</h1>
<p class="sub">If an account exists for that address, a reset link is on its way. It expires in 3 days.</p>
<a href="{% url 'accounts:login' %}" class="btn btn-ghost btn-block">Back to sign in</a>
{% endblock %}

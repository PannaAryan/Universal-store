<div class="field{% if field.errors %} has-error{% endif %}{% if full %} full{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted" style="font-weight:400">(optional)</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
